<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Lokizio — Reset cache</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0f0f1a;
  color: #f0f0f5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  text-align: center;
}
h1 { color: #e94560; margin-bottom: 12px; }
.box {
  background: #1a1a2e;
  border: 1px solid #2a2a3e;
  border-radius: 12px;
  padding: 30px 24px;
  max-width: 480px;
  width: 100%;
}
.spinner {
  width: 36px;
  height: 36px;
  border: 3px solid #2a2a3e;
  border-top-color: #e94560;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 16px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }
.log {
  text-align: left;
  font-family: monospace;
  font-size: 12px;
  background: #0a0a14;
  padding: 12px;
  border-radius: 8px;
  margin-top: 12px;
  max-height: 200px;
  overflow-y: auto;
  color: #94a3b8;
}
.ok { color: #34d399; }
.err { color: #f87171; }
a {
  color: #e94560;
  text-decoration: none;
  display: inline-block;
  margin-top: 16px;
  padding: 10px 20px;
  border: 1px solid #e94560;
  border-radius: 8px;
}
</style>
</head>
<body>
<div class="box">
  <h1>🧹 Reset Lokizio</h1>
  <p>Nettoyage du cache et du Service Worker pour récupérer la dernière version.</p>
  <div class="spinner" id="spinner"></div>
  <div class="log" id="log"></div>
  <a href="./" id="goBtn" style="display:none">→ Retour à l'app</a>
</div>
<script>const log=document.getElementById("log"),spinner=document.getElementById("spinner"),goBtn=document.getElementById("goBtn");function add(t,n){const s=document.createElement("div");s.className=n||"",s.textContent=t,log.appendChild(s),log.scrollTop=log.scrollHeight}(async()=>{try{add("Recherche des Service Workers...");const t=await navigator.serviceWorker.getRegistrations();add(`${t.length} service worker(s) trouv\xE9(s)`);for(const e of t){const o=await e.unregister();add(`Unregister ${e.scope}: ${o?"OK":"KO"}`,o?"ok":"err")}add("Suppression des caches...");const n=await caches.keys();add(`${n.length} cache(s) trouv\xE9(s)`);for(const e of n)await caches.delete(e),add(`Cache "${e}" supprim\xE9`,"ok");add("Nettoyage localStorage (cl\xE9s non auth)...");const s=["sb-mrvejwyvhuivmipfwlzz-auth-token"];for(let e=localStorage.length-1;e>=0;e--){const o=localStorage.key(e);o&&!s.some(r=>o.startsWith(r))&&localStorage.removeItem(o)}add("localStorage nettoy\xE9 (session conserv\xE9e)","ok"),add("\u2713 Termin\xE9. Tu peux retourner \xE0 l'app.","ok"),spinner.style.display="none",goBtn.style.display="inline-block",setTimeout(()=>{location.href="./"},2e3)}catch(t){add("Erreur: "+t.message,"err"),spinner.style.display="none",goBtn.style.display="inline-block"}})();</script>
</body>
</html>
